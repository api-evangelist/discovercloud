x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    DiscoverCloud is a B2B software-review marketplace with no developer program of any kind: there
    is no api./docs./developers. subdomain (all NXDOMAIN), no GitHub organization, no package on npm,
    PyPI, RubyGems or crates.io, and every conventional spec and /.well-known/ path on
    www.discovercloud.com — /openapi.json, /swagger.json, /api-docs, /graphql, /llms.txt,
    /.well-known/security.txt, /.well-known/agent-card.json — is swallowed by the ASP.NET catch-all
    302 to /pagenotfound; the only JSON surface on the host is the unauthenticated, undocumented
    ASP.NET Web API under /api/ that its own Angular front-end calls, which exposes no swagger,
    no /Help page and no reference.
  evidence:
    - url: https://www.discovercloud.com/openapi.json
      status: 302
    - url: https://www.discovercloud.com/swagger/docs/v1
      status: 302
    - url: https://www.discovercloud.com/.well-known/agent-card.json
      status: 302
    - url: https://www.discovercloud.com/llms.txt
      status: 302
    - url: https://www.discovercloud.com/api/swagger.json
      status: 404
    - url: https://api.discovercloud.com/
      status: 0
  checked: '2026-09-06'
